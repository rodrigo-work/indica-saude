
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      # target: dev
    # command: pnpm turbo run dev --filter=web
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - default
    environment:
      - NODE_ENV=development
      - CI=true

networks:
  default:
    name: localhost
    driver: bridge


