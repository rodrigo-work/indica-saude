name: CI apps/web - Preview
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
  # For Remote Caching
  # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # TURBO_TEAM: ${{ vars.TURBO_TEAM }}

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize]
  # push:
  #   branches: ['develop']

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install # --no-frozen-lockfile

      - name: Globally install Turborepo
        run: pnpm install -g turbo@latest

      - name: Globally install Vercel CLI
        run: pnpm install -g vercel@latest

      - name: Build
        run: |
          # Builds the dependencies of the docs target
          # https://turbo.build/repo/docs/reference/run#microsyntaxes-for-filtering
          # We need to do this since  `vc build` does not currently
          # follow the package or task graph (like Turborepo can).
          export VERCEL_TOKEN=m3rsDkemhdcPgMdnweeSTqUW
          turbo build --filter=web^...
          # Pull environment info
          vercel pull --yes --environment=preview --token=${{ 'm3rsDkemhdcPgMdnweeSTqUW' }}
          vercel build --token=${{ 'm3rsDkemhdcPgMdnweeSTqUW' }}

      - name: Deploy
        run: |
          vercel deploy --prebuilt --token=${{ 'm3rsDkemhdcPgMdnweeSTqUW' }}
